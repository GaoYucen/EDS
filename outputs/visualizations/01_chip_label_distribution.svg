<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
<style>
text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#1f2933}
.title{font-size:22px;font-weight:700}
.subtitle{font-size:12px;fill:#52606d}
.axis{stroke:#cbd2d9;stroke-width:1}
.label{font-size:12px}
.small{font-size:10px;fill:#52606d}
</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="32" y="38" class="title">Chip Weak Label Distribution</text>
<text x="32" y="60" class="subtitle">Uncolored chips are candidate negatives, not confirmed normal samples.</text>
<line x1="120" y1="330" x2="700" y2="330" class="axis"/>
<rect x="120" y="316" width="190" height="14" rx="4" fill="#d64545"/>
<text x="215.0" y="306" text-anchor="middle" class="label">4</text>
<text x="215.0" y="354" text-anchor="middle" class="label">marked_damaged</text>
<rect x="380" y="90" width="190" height="240" rx="4" fill="#2f80ed"/>
<text x="475.0" y="80" text-anchor="middle" class="label">68</text>
<text x="475.0" y="354" text-anchor="middle" class="label">candidate_negative</text>
</svg>